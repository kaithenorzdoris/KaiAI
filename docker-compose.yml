# ==========================================================================
#  KaiAI — Docker Compose
#  Chạy:  docker compose up -d --build
# ==========================================================================
services:
  kaiai:
    build: .
    image: kaiai:6.0.0
    container_name: kaiai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAI_DATA_DIR: /app/data
      PORT: "8080"
      ENABLE_KEEP_ALIVE: "true"
    volumes:
      - kaiai-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

volumes:
  kaiai-data:
