[project]
name = "kaiai"
version = "6.2.0"
description = "KaiAI — Discord bot đa năng: AI chat, kinh tế ảo, game, quản trị, giải trí."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4.0,<3.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pytz>=2024.1",
    "Flask>=3.0.0,<4.0.0",
    "waitress>=3.0.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "_backup_pre_v5", "archive_old", "cogs/games.py", "cogs/kai_premium.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
