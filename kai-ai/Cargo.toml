[workspace]
resolver = "2"
members = [
  "crates/kai-core",
  "crates/kai-config",
  "crates/kai-security",
  "crates/kai-database",
  "crates/kai-economy",
  "crates/kai-ai",
  "crates/kai-discord",
  "crates/kai-web",
]
default-members = ["crates/kai-discord"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
sha2 = "0.10"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "rustls_backend"] }
